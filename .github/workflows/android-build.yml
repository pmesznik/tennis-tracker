name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Read app version
        id: ver
        run: echo "name=$(node -p "require('fs').readFileSync('src/version.js','utf8').match(/APP_VERSION = \"([^\"]+)\"/)[1]")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Rename APK with version
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/tennis-tracker-v${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-tracker-v${{ github.run_number }}
          path: out/tennis-tracker-v${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tennis Tracker v${{ github.run_number }} (${{ steps.ver.outputs.name }})
          files: out/tennis-tracker-v${{ github.run_number }}.apk
