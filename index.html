<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0A0A12" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tennis Tracker</title>
    <style>
      /* Bezpieczne marginesy pod paski systemowe: najpierw wartość wstrzykiwana przez Capacitor
         (działa też na starszych WebView), potem natywne env(). */
      :root {
        --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        --sal: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
        --sar: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
        --app-h: 100vh;
      }
      @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
      html, body { margin: 0; }
      html { -webkit-text-size-adjust: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
